services:
  # ============================================================================
  # MongoDB Database Service (Internal to Compose network)
  # ============================================================================
  mongodb:
    image: mongo:7.0
    container_name: openvyapar-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: openvyapar
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - openvyapar-network

  # ============================================================================
  # OpenVyapar Backend API & AI Agents Service (Exposed Port 3000)
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openvyapar-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      ENABLE_MONGODB: "true"
      MONGODB_URI: mongodb://mongodb:27017/openvyapar
      MONGODB_DB_NAME: openvyapar
      MONGODB_MAX_POOL_SIZE: 10
      MONGODB_SERVER_SELECTION_TIMEOUT_MS: 5000
      MONGODB_CONNECT_TIMEOUT_MS: 10000
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000,https://*.vercel.app}
      CRYPTO_SIGNING_SECRET: ${CRYPTO_SIGNING_SECRET:-openvyapar_dev_secret_key_change_in_production_2026}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-20b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - backend_data:/app/backend/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/live').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - openvyapar-network

  # ============================================================================
  # OpenVyapar Frontend React SPA (Exposed Port 5173)
  # ============================================================================
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:3000}
    container_name: openvyapar-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/healthz"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - openvyapar-network

networks:
  openvyapar-network:
    driver: bridge

volumes:
  mongo_data:
    name: openvyapar_mongo_data
  backend_data:
    name: openvyapar_backend_data
