<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenVyapar - DPI User Flow Diagram</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #070e1b;
      color: #f8fafc;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 24px;
    }
    .header {
      width: 100%;
      max-width: 1600px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid #1e293b;
    }
    .title {
      font-size: 20px;
      font-weight: 800;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .actions {
      display: flex;
      gap: 12px;
    }
    .btn {
      background: #0f172a;
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.4);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn:hover {
      background: #1e293b;
      border-color: #fbbf24;
    }
    .diagram-container {
      width: 100%;
      max-width: 1600px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      border: 1px solid #1e293b;
      background: #070e1b;
    }
    img, svg {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">
      <span>🛡️ OpenVyapar DPI User Flow & Architecture Diagram</span>
    </div>
    <div class="actions">
      <a href="userflow.svg" download="openvyapar-userflow.svg" class="btn">📥 Download SVG</a>
    </div>
  </div>

  <div class="diagram-container">
    <img src="userflow.svg" alt="OpenVyapar User Flow Diagram" />
  </div>
</body>
</html>
