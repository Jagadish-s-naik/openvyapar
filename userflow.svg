<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" width="100%" height="100%" style="background:#070e1b; font-family:'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="navy-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e1d35"/>
      <stop offset="100%" stop-color="#0a1424"/>
    </linearGradient>
    <linearGradient id="glow-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="glow-rose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="glow-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Filters & Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.4"/>
    </filter>

    <!-- Arrow Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f43f5e"/>
    </marker>
  </defs>

  <!-- Background Grid Pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4"/>
  </pattern>
  <rect width="1600" height="1100" fill="url(#grid)"/>

  <!-- ==================== HEADER ==================== -->
  <g transform="translate(60, 45)">
    <!-- Squircle Gold Logo -->
    <rect x="0" y="0" width="48" height="48" rx="12" fill="#0a1424" stroke="url(#gold-grad)" stroke-width="2.5" filter="url(#gold-glow)"/>
    <path d="M14 14 L24 35 L34 14 L28 14 L24 25 L20 14 Z" fill="url(#gold-grad)"/>

    <text x="64" y="28" font-size="24" font-weight="800" fill="#ffffff" letter-spacing="-0.5">OpenVyapar</text>
    <text x="210" y="28" font-size="14" font-weight="700" fill="#f59e0b" letter-spacing="1">DPI USER FLOW &amp; ARCHITECTURE</text>
    <text x="64" y="44" font-size="12" font-weight="500" fill="#94a3b8">End-to-End Sovereign Identity, Verifiable Credential Exchange &amp; Cryptographic Verification Flow</text>
  </g>

  <!-- ==================== PHASE 1: ASSISTED ONBOARDING ==================== -->
  <g transform="translate(60, 130)">
    <!-- Container Card -->
    <rect width="710" height="380" rx="20" fill="url(#navy-card)" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
    
    <!-- Step Badge -->
    <rect x="24" y="20" width="96" height="24" rx="12" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
    <text x="72" y="36" font-size="11" font-weight="700" fill="#fbbf24" text-anchor="middle">PHASE 1</text>
    
    <text x="130" y="37" font-size="16" font-weight="700" fill="#ffffff">Assisted Merchant Onboarding (:5175)</text>
    <text x="24" y="68" font-size="12" fill="#94a3b8">Field witness conversational onboarding for non-digitized informal MSMEs</text>

    <!-- Step 1.1: Merchant Voice / Transcript -->
    <rect x="24" y="90" width="200" height="110" rx="14" fill="#070e1b" stroke="#334155" stroke-width="1"/>
    <text x="38" y="115" font-size="12" font-weight="700" fill="#e2e8f0">1. Multilingual Narrative</text>
    <text x="38" y="135" font-size="11" fill="#94a3b8">Merchant speaks trade story:</text>
    <text x="38" y="152" font-size="10" font-family="'JetBrains Mono', monospace" fill="#fbbf24">"शर्मा जनरल स्टोर..."</text>
    <text x="38" y="170" font-size="10" fill="#64748b">Hindi · Kannada · English</text>

    <!-- Arrow 1.1 -> 1.2 -->
    <line x1="224" y1="145" x2="252" y2="145" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Step 1.2: Agent NLP Extraction -->
    <rect x="256" y="90" width="200" height="110" rx="14" fill="#070e1b" stroke="#334155" stroke-width="1"/>
    <text x="270" y="115" font-size="12" font-weight="700" fill="#38bdf8">2. Agent NLP Extraction</text>
    <text x="270" y="135" font-size="10" font-family="'JetBrains Mono', monospace" fill="#94a3b8">POST /agent/onboard-extract</text>
    <text x="270" y="152" font-size="10" fill="#e2e8f0">✓ Trade Name &amp; Sector</text>
    <text x="270" y="170" font-size="10" fill="#e2e8f0">✓ Monthly Revenue &amp; Geo</text>

    <!-- Arrow 1.2 -> 1.3 -->
    <line x1="456" y1="145" x2="484" y2="145" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Step 1.3: Genesis DID Minting -->
    <rect x="488" y="90" width="198" height="110" rx="14" fill="#070e1b" stroke="#334155" stroke-width="1"/>
    <text x="502" y="115" font-size="12" font-weight="700" fill="#10b981">3. Genesis DID Minting</text>
    <text x="502" y="135" font-size="10" font-family="'JetBrains Mono', monospace" fill="#94a3b8">POST /business</text>
    <text x="502" y="152" font-size="10" font-family="'JetBrains Mono', monospace" fill="#10b981">did:biz:OV-4471</text>
    <text x="502" y="170" font-size="10" fill="#64748b">Anchors Keypair &amp; Starter VC</text>

    <!-- Bottom Result Banner -->
    <rect x="24" y="225" width="662" height="125" rx="14" fill="#0a1424" stroke="#10b981" stroke-width="1" stroke-dasharray="4,4"/>
    <circle cx="50" cy="255" r="12" fill="#10b981" fill-opacity="0.2"/>
    <text x="50" y="260" font-size="14" fill="#10b981" font-weight="900" text-anchor="middle">✓</text>
    <text x="72" y="258" font-size="13" font-weight="700" fill="#ffffff">Sovereign Business Certificate Issued</text>
    <text x="72" y="278" font-size="11" fill="#94a3b8">Merchant receives SMS delivery containing sovereign Business DID, QR pass link, and instant wallet access.</text>
    
    <rect x="72" y="295" width="220" height="35" rx="8" fill="#1e293b"/>
    <text x="84" y="316" font-size="11" font-family="'JetBrains Mono', monospace" fill="#fbbf24">ID: did:biz:OV-4471</text>

    <rect x="310" y="295" width="350" height="35" rx="8" fill="#1e293b"/>
    <text x="322" y="316" font-size="11" fill="#e2e8f0">Starter Credential: <tspan font-weight="700" fill="#10b981">Agent Witnessed Self-Attestation</tspan></text>
  </g>

  <!-- ==================== PHASE 2: SOVEREIGN OWNER WALLET ==================== -->
  <g transform="translate(830, 130)">
    <!-- Container Card -->
    <rect width="710" height="380" rx="20" fill="url(#navy-card)" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>

    <!-- Step Badge -->
    <rect x="24" y="20" width="96" height="24" rx="12" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
    <text x="72" y="36" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">PHASE 2</text>

    <text x="130" y="37" font-size="16" font-weight="700" fill="#ffffff">Business Owner Wallet Hub (:5173)</text>
    <text x="24" y="68" font-size="12" fill="#94a3b8">Sovereign identity, credential vault, consent control, and AI routing</text>

    <!-- 3 Wallet Pillars -->
    <!-- Pillar 1: Identity & QR -->
    <rect x="24" y="90" width="205" height="160" rx="14" fill="#070e1b" stroke="#334155" stroke-width="1"/>
    <rect x="38" y="105" width="28" height="28" rx="6" fill="#f59e0b" fill-opacity="0.2"/>
    <text x="52" y="124" font-size="14" fill="#fbbf24" font-weight="900" text-anchor="middle">🆔</text>
    <text x="74" y="124" font-size="13" font-weight="700" fill="#ffffff">Identity &amp; QR</text>
    <text x="38" y="152" font-size="11" fill="#94a3b8">• Sovereign DID &amp; Pass</text>
    <text x="38" y="172" font-size="11" fill="#94a3b8">• Dynamic QR Code</text>
    <text x="38" y="192" font-size="11" fill="#94a3b8">• Multilingual UI (EN/HI/KN)</text>
    <text x="38" y="222" font-size="10" font-family="'JetBrains Mono', monospace" fill="#38bdf8">Sri Lakshmi Textiles</text>

    <!-- Pillar 2: Verifiable Credentials -->
    <rect x="251" y="90" width="205" height="160" rx="14" fill="#070e1b" stroke="#334155" stroke-width="1"/>
    <rect x="265" y="105" width="28" height="28" rx="6" fill="#10b981" fill-opacity="0.2"/>
    <text x="279" y="124" font-size="14" fill="#10b981" font-weight="900" text-anchor="middle">📜</text>
    <text x="301" y="124" font-size="13" font-weight="700" fill="#ffffff">Verifiable VCs</text>
    <text x="265" y="152" font-size="11" fill="#94a3b8">• Udyam MSME Certificate</text>
    <text x="265" y="172" font-size="11" fill="#94a3b8">• GST Compliance Card</text>
    <text x="265" y="192" font-size="11" fill="#94a3b8">• W3C Proof Exporter</text>
    <text x="265" y="222" font-size="10" font-family="'JetBrains Mono', monospace" fill="#10b981">Ed25519-Signed</text>

    <!-- Pillar 3: Zero-Custody AI -->
    <rect x="478" y="90" width="208" height="160" rx="14" fill="#070e1b" stroke="#334155" stroke-width="1"/>
    <rect x="492" y="105" width="28" height="28" rx="6" fill="#a855f7" fill-opacity="0.2"/>
    <text x="506" y="124" font-size="14" fill="#c084fc" font-weight="900" text-anchor="middle">🤖</text>
    <text x="528" y="124" font-size="13" font-weight="700" fill="#ffffff">AI Assistant</text>
    <text x="492" y="152" font-size="11" fill="#94a3b8">• Natural Language Routing</text>
    <text x="492" y="172" font-size="11" fill="#94a3b8">• Zero-Custody Guarantee</text>
    <text x="492" y="192" font-size="11" fill="#94a3b8">• Vernacular Intent Parse</text>
    <text x="492" y="222" font-size="10" font-family="'JetBrains Mono', monospace" fill="#c084fc">POST /agent/assist</text>

    <!-- Bottom Wallet Callout -->
    <rect x="24" y="265" width="662" height="85" rx="12" fill="#0a1424" stroke="#334155" stroke-width="1"/>
    <text x="40" y="292" font-size="12" font-weight="700" fill="#e2e8f0">Zero-Custody Architectural Principle</text>
    <text x="40" y="312" font-size="11" fill="#94a3b8">The AI Assistant never executes approvals or transfers keys autonomously; it navigates the user to the precise screen for sovereign human signoff via OTP / biometric authorization.</text>
  </g>

  <!-- ==================== PHASE 3: CONSENT & DELEGATION LIFECYCLE ==================== -->
  <g transform="translate(60, 540)">
    <!-- Container Card -->
    <rect width="710" height="490" rx="20" fill="url(#navy-card)" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>

    <!-- Step Badge -->
    <rect x="24" y="20" width="96" height="24" rx="12" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
    <text x="72" y="36" font-size="11" font-weight="700" fill="#fbbf24" text-anchor="middle">PHASE 3</text>

    <text x="130" y="37" font-size="16" font-weight="700" fill="#ffffff">Consent &amp; Delegation Engine</text>
    <text x="24" y="68" font-size="12" fill="#94a3b8">Time-bound, purpose-scoped data sharing with 1-click revocation</text>

    <!-- Step 3.1: Inbound Request -->
    <rect x="24" y="90" width="662" height="65" rx="12" fill="#070e1b" stroke="#334155" stroke-width="1"/>
    <text x="40" y="115" font-size="12" font-weight="700" fill="#fbbf24">Inbound Request from Node</text>
    <text x="40" y="135" font-size="11" fill="#94a3b8">e.g. <tspan fill="#ffffff" font-weight="600">State Bank of India — MSME Sahay</tspan> requests GST &amp; Udyam access for 30 days to underwrite ₹15L working capital line.</text>

    <!-- Decision Diamond / Split -->
    <!-- Left: Authorize -->
    <g transform="translate(24, 175)">
      <rect width="318" height="150" rx="14" fill="#070e1b" stroke="#10b981" stroke-width="1.5"/>
      <rect x="16" y="16" width="80" height="22" rx="11" fill="#10b981" fill-opacity="0.2"/>
      <text x="56" y="31" font-size="11" font-weight="700" fill="#10b981" text-anchor="middle">AUTHORIZE</text>
      
      <text x="16" y="60" font-size="11" fill="#e2e8f0">• OTP Verified by Owner</text>
      <text x="16" y="78" font-size="11" fill="#e2e8f0">• Token issued with scope limitation</text>
      <text x="16" y="96" font-size="11" fill="#e2e8f0">• Moves to "Active Consents" tab</text>
      
      <rect x="16" y="110" width="286" height="26" rx="6" fill="#1e293b"/>
      <text x="26" y="127" font-size="10" font-family="'JetBrains Mono', monospace" fill="#10b981">POST /delegation (Status: approved)</text>
    </g>

    <!-- Right: Deny / Revoke -->
    <g transform="translate(368, 175)">
      <rect width="318" height="150" rx="14" fill="#070e1b" stroke="#f43f5e" stroke-width="1.5"/>
      <rect x="16" y="16" width="96" height="22" rx="11" fill="#f43f5e" fill-opacity="0.2"/>
      <text x="64" y="31" font-size="11" font-weight="700" fill="#f43f5e" text-anchor="middle">DENY / REVOKE</text>

      <text x="16" y="60" font-size="11" fill="#e2e8f0">• 1-Click Revocation Guarantee</text>
      <text x="16" y="78" font-size="11" fill="#e2e8f0">• Invalidation of all active keys</text>
      <text x="16" y="96" font-size="11" fill="#e2e8f0">• Moves to "History" tab</text>

      <rect x="16" y="110" width="286" height="26" rx="6" fill="#1e293b"/>
      <text x="26" y="127" font-size="10" font-family="'JetBrains Mono', monospace" fill="#f43f5e">POST /delegation/revoke</text>
    </g>

    <!-- Immutable Audit Trail Box -->
    <rect x="24" y="345" width="662" height="120" rx="14" fill="#070e1b" stroke="#e2e8f0" stroke-opacity="0.2" stroke-width="1"/>
    <text x="40" y="375" font-size="12" font-weight="700" fill="#ffffff">📜 Cryptographic Audit Ledger Update</text>
    <text x="40" y="395" font-size="11" fill="#94a3b8">Every decision is appended to the immutable chronological ledger with actor attribution and event reference IDs:</text>
    <rect x="40" y="410" width="630" height="40" rx="8" fill="#1e293b"/>
    <text x="52" y="428" font-size="10" font-family="'JetBrains Mono', monospace" fill="#e2e8f0">[2024-09-18 10:30:44] <tspan fill="#38bdf8">Business Owner (Self)</tspan> → <tspan fill="#10b981">Approved consent for SBI</tspan> <tspan fill="#fbbf24">(cst-sbi-991)</tspan></text>
    <text x="52" y="443" font-size="10" font-family="'JetBrains Mono', monospace" fill="#94a3b8">[2024-09-22 14:15:02] <tspan fill="#fbbf24">SBI MSME Sahay</tspan> → <tspan fill="#38bdf8">Accessed GST Compliance Certificate (Hash: #a98f...e10)</tspan></text>
  </g>

  <!-- ==================== PHASE 4: VERIFIER PORTAL & TAMPER SIMULATOR ==================== -->
  <g transform="translate(830, 540)">
    <!-- Container Card -->
    <rect width="710" height="490" rx="20" fill="url(#navy-card)" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>

    <!-- Step Badge -->
    <rect x="24" y="20" width="96" height="24" rx="12" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1"/>
    <text x="72" y="36" font-size="11" font-weight="700" fill="#10b981" text-anchor="middle">PHASE 4</text>

    <text x="130" y="37" font-size="16" font-weight="700" fill="#ffffff">Verifier Portal &amp; Tamper Simulator (:5174)</text>
    <text x="24" y="68" font-size="12" fill="#94a3b8">Automated cryptographic proof inspection and real-time tamper detection</text>

    <!-- Inspection Input -->
    <rect x="24" y="90" width="662" height="60" rx="12" fill="#070e1b" stroke="#334155" stroke-width="1"/>
    <text x="40" y="115" font-size="12" font-weight="700" fill="#e2e8f0">Proof Share Inspection</text>
    <text x="40" y="135" font-size="11" font-family="'JetBrains Mono', monospace" fill="#fbbf24">GET /proof/verify/proof-share-sharma-loan-001</text>

    <!-- Verification Dual Outcome -->
    <!-- Case 1: Authentic -->
    <g transform="translate(24, 165)">
      <rect width="318" height="190" rx="14" fill="#070e1b" stroke="#10b981" stroke-width="1.5"/>
      <rect x="16" y="16" width="90" height="22" rx="11" fill="#10b981" fill-opacity="0.2"/>
      <text x="61" y="31" font-size="11" font-weight="700" fill="#10b981" text-anchor="middle">VALIDATED</text>

      <text x="16" y="60" font-size="12" font-weight="700" fill="#ffffff">HMAC Signature Authentic</text>
      <text x="16" y="80" font-size="11" fill="#94a3b8">• Proof matches issuer root key</text>
      <text x="16" y="98" font-size="11" fill="#94a3b8">• GST &amp; Udyam claims verified</text>
      <text x="16" y="116" font-size="11" fill="#94a3b8">• AI trust flags: <tspan fill="#10b981">Clean record</tspan></text>

      <rect x="16" y="135" width="286" height="38" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="159" y="158" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">🟢 Loan Sanction Approved</text>
    </g>

    <!-- Case 2: Tampered -->
    <g transform="translate(368, 165)">
      <rect width="318" height="190" rx="14" fill="#070e1b" stroke="#f43f5e" stroke-width="1.5"/>
      <rect x="16" y="16" width="130" height="22" rx="11" fill="#f43f5e" fill-opacity="0.2"/>
      <text x="81" y="31" font-size="11" font-weight="700" fill="#f43f5e" text-anchor="middle">TAMPER SIMULATED</text>

      <text x="16" y="60" font-size="12" font-weight="700" fill="#f43f5e">Signature Verification Failed</text>
      <text x="16" y="80" font-size="11" fill="#94a3b8">• Memory altered turnover figure</text>
      <text x="16" y="98" font-size="11" fill="#94a3b8">• Hash mismatch against root</text>
      <text x="16" y="116" font-size="11" fill="#94a3b8">• Red alert banner displayed</text>

      <rect x="16" y="135" width="286" height="38" rx="8" fill="#881337" stroke="#f43f5e" stroke-width="1"/>
      <text x="159" y="158" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">🔴 Underwriting Blocked</text>
    </g>

    <!-- Verifier Key Takeaway Footer -->
    <rect x="24" y="370" width="662" height="95" rx="12" fill="#070e1b" stroke="#334155" stroke-width="1"/>
    <text x="40" y="398" font-size="12" font-weight="700" fill="#ffffff">Instant Tamper Detection &amp; Zero-Trust Protocol</text>
    <text x="40" y="420" font-size="11" fill="#94a3b8">Any unauthorized in-flight alteration to credential claims breaks the HMAC-SHA256 signature chain, immediately alerting the underwriter and protecting institutional capital.</text>
  </g>
</svg>
