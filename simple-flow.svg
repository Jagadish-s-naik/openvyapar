<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" style="background:#070e1b; font-family:'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e1d35"/>
      <stop offset="100%" stop-color="#0a1424"/>
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Arrowhead Markers -->
    <marker id="arrow-gold" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Title & Header -->
  <g transform="translate(60, 40)">
    <text x="0" y="24" font-size="22" font-weight="800" fill="#ffffff" letter-spacing="-0.5">OpenVyapar Interaction Flow</text>
    <text x="315" y="24" font-size="14" font-weight="700" fill="#f59e0b" letter-spacing="1">BUSINESS OWNER ↔ VERIFIER</text>
    <text x="0" y="44" font-size="12" fill="#94a3b8">Simple step-by-step cryptographic exchange and underwriting workflow</text>
  </g>

  <!-- ==================== LEFT COLUMN: BUSINESS OWNER ==================== -->
  <g transform="translate(60, 110)">
    <!-- Owner Main Card -->
    <rect width="450" height="500" rx="18" fill="url(#card-bg)" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>
    
    <!-- Owner Header -->
    <rect x="20" y="20" width="410" height="56" rx="12" fill="#070e1b" stroke="#334155" stroke-width="1"/>
    <circle cx="50" cy="48" r="16" fill="#f59e0b" fill-opacity="0.2"/>
    <text x="50" y="53" font-size="16" text-anchor="middle">💼</text>
    <text x="78" y="44" font-size="15" font-weight="800" fill="#ffffff">Business Owner</text>
    <text x="78" y="60" font-size="11" font-family="'JetBrains Mono', monospace" fill="#fbbf24">Owner Wallet (:5173)</text>

    <!-- Step 1: Receives Inbound Request -->
    <g transform="translate(20, 95)">
      <rect width="410" height="75" rx="12" fill="#070e1b" stroke="#334155" stroke-width="1"/>
      <rect x="14" y="14" width="24" height="24" rx="6" fill="#38bdf8" fill-opacity="0.2"/>
      <text x="26" y="31" font-size="12" font-weight="800" fill="#38bdf8" text-anchor="middle">1</text>
      <text x="48" y="31" font-size="13" font-weight="700" fill="#ffffff">Receives Inbound Data Request</text>
      <text x="48" y="52" font-size="11" fill="#94a3b8">Bank requests GSTIN &amp; Udyam credentials for ₹15L loan.</text>
    </g>

    <!-- Step 2: Reviews & Authorizes Consent -->
    <g transform="translate(20, 185)">
      <rect width="410" height="75" rx="12" fill="#070e1b" stroke="#f59e0b" stroke-width="1.5"/>
      <rect x="14" y="14" width="24" height="24" rx="6" fill="#f59e0b" fill-opacity="0.2"/>
      <text x="26" y="31" font-size="12" font-weight="800" fill="#fbbf24" text-anchor="middle">2</text>
      <text x="48" y="31" font-size="13" font-weight="700" fill="#fbbf24">Approves Scoped Consent (OTP)</text>
      <text x="48" y="52" font-size="11" fill="#94a3b8">Grants 30-day selective access with zero key custody.</text>
    </g>

    <!-- Step 3: Generates Proof Token -->
    <g transform="translate(20, 275)">
      <rect width="410" height="75" rx="12" fill="#070e1b" stroke="#334155" stroke-width="1"/>
      <rect x="14" y="14" width="24" height="24" rx="6" fill="#10b981" fill-opacity="0.2"/>
      <text x="26" y="31" font-size="12" font-weight="800" fill="#10b981" text-anchor="middle">3</text>
      <text x="48" y="31" font-size="13" font-weight="700" fill="#ffffff">Generates Cryptographic Proof</text>
      <text x="48" y="52" font-size="11" font-family="'JetBrains Mono', monospace" fill="#10b981">proof-share-sharma-loan-001</text>
    </g>

    <!-- 1-Click Revocation Safety Net -->
    <g transform="translate(20, 365)">
      <rect width="410" height="110" rx="12" fill="#070e1b" stroke="#f43f5e" stroke-dasharray="3,3" stroke-width="1"/>
      <text x="16" y="28" font-size="12" font-weight="700" fill="#f43f5e">🛡️ Sovereign Control &amp; 1-Click Revocation</text>
      <text x="16" y="50" font-size="11" fill="#cbd5e1">The owner can revoke access at any time with 1-click,</text>
      <text x="16" y="68" font-size="11" fill="#cbd5e1">immediately invalidating keys and alerting the ledger.</text>
      <rect x="16" y="78" width="378" height="22" rx="4" fill="#1e293b"/>
      <text x="24" y="93" font-size="10" font-family="'JetBrains Mono', monospace" fill="#94a3b8">POST /delegation/revoke → Keys Disabled</text>
    </g>
  </g>

  <!-- ==================== CENTER CONNECTOR ARROWS ==================== -->
  <g transform="translate(510, 110)">
    <!-- Arrow 1: Request Flow (Right to Left) -->
    <path d="M 180 132 L 0 132" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arrow-blue)"/>
    <rect x="25" y="112" width="130" height="22" rx="6" fill="#0b1e3b" stroke="#38bdf8" stroke-width="1"/>
    <text x="90" y="127" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">1. Request Access</text>

    <!-- Arrow 2: Proof Flow (Left to Right) -->
    <path d="M 0 312 L 180 312" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow-gold)"/>
    <rect x="20" y="292" width="140" height="22" rx="6" fill="#2d1c03" stroke="#f59e0b" stroke-width="1"/>
    <text x="90" y="307" font-size="10" font-weight="700" fill="#fbbf24" text-anchor="middle">2. Share Signed Proof</text>

    <!-- Arrow 3: Sanction / Verification Result (Right to Left) -->
    <path d="M 180 435 L 0 435" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrow-green)"/>
    <rect x="20" y="415" width="140" height="22" rx="6" fill="#042f2e" stroke="#10b981" stroke-width="1"/>
    <text x="90" y="430" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">3. Sanction Approved</text>
  </g>

  <!-- ==================== RIGHT COLUMN: VERIFIER (BANK / LENDER) ==================== -->
  <g transform="translate(690, 110)">
    <!-- Verifier Main Card -->
    <rect width="450" height="500" rx="18" fill="url(#card-bg)" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow)"/>

    <!-- Verifier Header -->
    <rect x="20" y="20" width="410" height="56" rx="12" fill="#070e1b" stroke="#334155" stroke-width="1"/>
    <circle cx="50" cy="48" r="16" fill="#38bdf8" fill-opacity="0.2"/>
    <text x="50" y="53" font-size="16" text-anchor="middle">🔍</text>
    <text x="78" y="44" font-size="15" font-weight="800" fill="#ffffff">Verifier (Bank / Lender / ONDC)</text>
    <text x="78" y="60" font-size="11" font-family="'JetBrains Mono', monospace" fill="#38bdf8">Verifier Portal (:5174)</text>

    <!-- Step 1: Inspects Token -->
    <g transform="translate(20, 95)">
      <rect width="410" height="75" rx="12" fill="#070e1b" stroke="#334155" stroke-width="1"/>
      <rect x="14" y="14" width="24" height="24" rx="6" fill="#38bdf8" fill-opacity="0.2"/>
      <text x="26" y="31" font-size="12" font-weight="800" fill="#38bdf8" text-anchor="middle">4</text>
      <text x="48" y="31" font-size="13" font-weight="700" fill="#ffffff">Inputs Proof Token ID</text>
      <text x="48" y="52" font-size="11" font-family="'JetBrains Mono', monospace" fill="#94a3b8">GET /proof/verify/:proof_id</text>
    </g>

    <!-- Step 2: Cryptographic HMAC Signature Check -->
    <g transform="translate(20, 185)">
      <rect width="410" height="75" rx="12" fill="#070e1b" stroke="#10b981" stroke-width="1.5"/>
      <rect x="14" y="14" width="24" height="24" rx="6" fill="#10b981" fill-opacity="0.2"/>
      <text x="26" y="31" font-size="12" font-weight="800" fill="#10b981" text-anchor="middle">5</text>
      <text x="48" y="31" font-size="13" font-weight="700" fill="#10b981">HMAC-SHA256 Signature Verification</text>
      <text x="48" y="52" font-size="11" fill="#94a3b8">Verifies claims against Ministry MSME &amp; GSTN root keys.</text>
    </g>

    <!-- Step 3: AI Trust Check & Loan Decision -->
    <g transform="translate(20, 275)">
      <rect width="410" height="75" rx="12" fill="#070e1b" stroke="#334155" stroke-width="1"/>
      <rect x="14" y="14" width="24" height="24" rx="6" fill="#38bdf8" fill-opacity="0.2"/>
      <text x="26" y="31" font-size="12" font-weight="800" fill="#38bdf8" text-anchor="middle">6</text>
      <text x="48" y="31" font-size="13" font-weight="700" fill="#ffffff">Cross-Registry AI Trust Check</text>
      <text x="48" y="52" font-size="11" fill="#94a3b8">Trust score computed via POST /agent/verifier-flag.</text>
    </g>

    <!-- Dual Result Badge -->
    <g transform="translate(20, 365)">
      <rect width="410" height="110" rx="12" fill="#070e1b" stroke="#10b981" stroke-width="1.5"/>
      <rect x="16" y="14" width="170" height="30" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
      <text x="101" y="34" font-size="12" font-weight="800" fill="#34d399" text-anchor="middle">🟢 VALIDATED (Sanction)</text>

      <rect x="200" y="14" width="194" height="30" rx="6" fill="#881337" stroke="#f43f5e" stroke-width="1"/>
      <text x="297" y="34" font-size="12" font-weight="800" fill="#fca5a5" text-anchor="middle">🔴 TAMPERED (Reject)</text>

      <text x="16" y="68" font-size="11" fill="#cbd5e1">Authentic payload → ₹5,00,000 credit limit approved.</text>
      <text x="16" y="88" font-size="11" fill="#cbd5e1">Tampered turnover → Automatic loan block &amp; security alert.</text>
    </g>
  </g>

  <!-- ==================== FOOTER ==================== -->
  <g transform="translate(60, 625)">
    <rect width="1080" height="35" rx="8" fill="#0a1424" stroke="#1e293b" stroke-width="1"/>
    <text x="20" y="22" font-size="11" fill="#94a3b8">📜 <tspan font-weight="700" fill="#ffffff">Audit Trail:</tspan> Both parties' actions are cryptographically sealed in the immutable audit ledger on Backend Port :3001.</text>
    <text x="960" y="22" font-size="11" font-family="'JetBrains Mono', monospace" fill="#fbbf24">DPI-MSME v1.4</text>
  </g>
</svg>
